{% extends "base.html" %}

{% block content %}
<div class="d-flex">
    {% include 'shared/_sidebar.html' %}
    
    <div class="main-content" style="margin-left: 250px; width: calc(100% - 250px); padding: 20px;">
        <div class="container-fluid px-0">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <!-- Header section with X button -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0">Track Supplements</h4>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-sm btn-outline-secondary rounded-circle">
                            <i class="fas fa-times"></i>
                        </a>
                    </div>
                    
                    <!-- Date indicator -->
                    <div class="alert alert-info mb-3">
                        <i class="fas fa-calendar-day me-2"></i>
                        Tracking supplements for: <strong>{{ today.strftime('%B %d, %Y') }}</strong>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <form method="POST" action="{{ url_for('supplement.track_supplements') }}" id="supplements-form">
                                <p class="mb-3">Check the supplements you've taken today:</p>
                                
                                <style>
                                    .supplement-grid {
                                        display: grid;
                                        grid-template-columns: repeat(3, 1fr);
                                        gap: 10px;
                                    }
                                    
                                    .supplement-item {
                                        border: 1px solid #dee2e6;
                                        border-radius: 4px;
                                        padding: 10px;
                                        background-color: #f8f9fa;
                                        transition: background-color 0.2s;
                                    }
                                    
                                    .supplement-item:hover {
                                        background-color: #e9ecef;
                                    }
                                    
                                    .supplement-item.checked {
                                        background-color: #e3f2fd;
                                        border-color: #90caf9;
                                    }
                                    
                                    .supplement-item input {
                                        margin-right: 8px;
                                        vertical-align: middle;
                                    }
                                    
                                    .supplement-item label {
                                        margin-bottom: 0;
                                        display: flex;
                                        align-items: center;
                                        width: 100%;
                                        cursor: pointer;
                                        white-space: nowrap;
                                        overflow: hidden;
                                        text-overflow: ellipsis;
                                    }
                                </style>
                                
                                <div class="supplement-grid">
                                    {% for supplement in supplements %}
                                    <div class="supplement-item {% if supplement in taken_supplements %}checked{% endif %}" onclick="toggleCheckbox('{{ supplement|lower|replace(' ', '_') }}')">
                                        <label>
                                            <input type="checkbox" 
                                                   class="form-check-input" 
                                                   id="{{ supplement|lower|replace(' ', '_') }}" 
                                                   name="{{ supplement|lower|replace(' ', '_') }}"
                                                   {% if supplement in taken_supplements %}checked{% endif %}>
                                            <span>{{ supplement }}</span>
                                        </label>
                                    </div>
                                    {% endfor %}
                                </div>
                                
                                <!-- Submit buttons -->
                                <div class="d-flex mt-4">
                                    <button type="submit" class="btn btn-primary me-2">Save</button>
                                    <button type="reset" class="btn btn-secondary me-2" onclick="resetForm()">Reset</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleCheckbox(id) {
        const checkbox = document.getElementById(id);
        checkbox.checked = !checkbox.checked;
        
        const parentItem = checkbox.closest('.supplement-item');
        if (checkbox.checked) {
            parentItem.classList.add('checked');
        } else {
            parentItem.classList.remove('checked');
        }
    }
    
    // Prevent clicking on the label from triggering the div's onClick
    document.querySelectorAll('.supplement-item input').forEach(checkbox => {
        checkbox.addEventListener('click', function(e) {
            e.stopPropagation();
            const parentItem = this.closest('.supplement-item');
            if (this.checked) {
                parentItem.classList.add('checked');
            } else {
                parentItem.classList.remove('checked');
            }
        });
    });
    
    function resetForm() {
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.checked = false;
            checkbox.closest('.supplement-item').classList.remove('checked');
        });
    }
</script>
{% endblock %}
