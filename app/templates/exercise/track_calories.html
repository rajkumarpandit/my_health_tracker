{% extends "base.html" %}

{% block content %}
<div class="d-flex">
    {% include 'shared/_sidebar.html' %}
    
    <div class="main-content" style="margin-left: 250px; width: calc(100% - 250px); padding: 20px;">
        <div class="container-fluid px-0">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <!-- Header section with X button -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0">Track Your Calories Burned</h4>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-sm btn-outline-secondary rounded-circle">
                            <i class="fas fa-times"></i>
                        </a>
                    </div>
                    
                    <!-- Add this below the header -->
                    <div class="alert alert-info mb-3">
                        <i class="fas fa-calendar-day me-2"></i>
                        Tracking calories burned for: <strong>{{ today.strftime('%B %d, %Y') }}</strong>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <form method="POST" action="{{ url_for('exercise.track_calories_burned') }}" id="calories-burned-form">
                                <!-- <p class="mb-4">Enter amount of calories you burnt in kCal in -</p> -->
                                
                                <!-- Updated form layout with 3 columns -->
                                <div class="row">
                                    <!-- First column -->
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="gym" class="form-label">Gym</label>
                                            <input type="number" class="form-control calorie-input" id="gym" name="gym" min="0" value="{{ calories.gym|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="running" class="form-label">Running</label>
                                            <input type="number" class="form-control calorie-input" id="running" name="running" min="0" value="{{ calories.running|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="yoga" class="form-label">Yoga</label>
                                            <input type="number" class="form-control calorie-input" id="yoga" name="yoga" min="0" value="{{ calories.yoga|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="zumba" class="form-label">Zumba</label>
                                            <input type="number" class="form-control calorie-input" id="zumba" name="zumba" min="0" value="{{ calories.zumba|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="hiit" class="form-label">HIIT</label>
                                            <input type="number" class="form-control calorie-input" id="hiit" name="hiit" min="0" value="{{ calories.hiit|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="cardio" class="form-label">Cardio</label>
                                            <input type="number" class="form-control calorie-input" id="cardio" name="cardio" min="0" value="{{ calories.cardio|default(0) }}" onchange="updateTotal()">
                                        </div>
                                    </div>
                                    
                                    <!-- Second column -->
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="cycling" class="form-label">Cycling</label>
                                            <input type="number" class="form-control calorie-input" id="cycling" name="cycling" min="0" value="{{ calories.cycling|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="swimming" class="form-label">Swimming</label>
                                            <input type="number" class="form-control calorie-input" id="swimming" name="swimming" min="0" value="{{ calories.swimming|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="walking" class="form-label">Walking</label>
                                            <input type="number" class="form-control calorie-input" id="walking" name="walking" min="0" value="{{ calories.walking|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="badminton" class="form-label">Badminton</label>
                                            <input type="number" class="form-control calorie-input" id="badminton" name="badminton" min="0" value="{{ calories.badminton|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="lawn_tennis" class="form-label">Lawn Tennis</label>
                                            <input type="number" class="form-control calorie-input" id="lawn_tennis" name="lawn_tennis" min="0" value="{{ calories.lawn_tennis|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="table_tennis" class="form-label">Table Tennis</label>
                                            <input type="number" class="form-control calorie-input" id="table_tennis" name="table_tennis" min="0" value="{{ calories.table_tennis|default(0) }}" onchange="updateTotal()">
                                        </div>
                                    </div>
                                    
                                    <!-- Third column -->
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="volleyball" class="form-label">Volleyball</label>
                                            <input type="number" class="form-control calorie-input" id="volleyball" name="volleyball" min="0" value="{{ calories.volleyball|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="basketball" class="form-label">Basketball</label>
                                            <input type="number" class="form-control calorie-input" id="basketball" name="basketball" min="0" value="{{ calories.basketball|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="cricket" class="form-label">Cricket</label>
                                            <input type="number" class="form-control calorie-input" id="cricket" name="cricket" min="0" value="{{ calories.cricket|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="football" class="form-label">Football</label>
                                            <input type="number" class="form-control calorie-input" id="football" name="football" min="0" value="{{ calories.football|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="other_sports" class="form-label">Other Sports</label>
                                            <input type="number" class="form-control calorie-input" id="other_sports" name="other_sports" min="0" value="{{ calories.other_sports|default(0) }}" onchange="updateTotal()">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="usual_movement" class="form-label">Usual Movement</label>
                                            <input type="number" class="form-control calorie-input" id="usual_movement" name="usual_movement" min="0" value="{{ calories.usual_movement|default(0) }}" onchange="updateTotal()">
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Total Calories -->
                                <div class="mt-4 p-3 bg-light rounded">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="fw-bold" style="font-size: 0.9rem;">Total Calories Burned:</span>
                                        <span class="fw-bold" style="font-size: 0.9rem;" id="total-calories">0 kCal</span>
                                    </div>
                                </div>

                                <!-- Step Count - New Section -->
                                <div class="mt-3">
                                    <div class="form-group">
                                        <label for="step_count" class="form-label">Daily Step Count</label>
                                        <input type="number" class="form-control" id="step_count" name="step_count" min="0" value="{{ calories.step_count|default(0) }}">
                                        <small class="form-text text-muted">Enter your total step count for the day</small>
                                    </div>
                                </div>
                                
                                <!-- Submit buttons -->
                                <div class="d-flex mt-4">
                                    <button type="submit" class="btn btn-primary me-2">Save</button>
                                    <button type="reset" class="btn btn-secondary me-2" onclick="resetForm()">Reset</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateTotal() {
        const inputs = document.querySelectorAll('.calorie-input');
        let total = 0;
        
        inputs.forEach(input => {
            const value = parseFloat(input.value) || 0;
            total += value;
        });
        
        document.getElementById('total-calories').textContent = total + ' kCal';
    }
    
    function resetForm() {
        document.querySelectorAll('.calorie-input').forEach(input => {
            input.value = 0;
        });
        updateTotal();
    }
    
    // Calculate initial total on page load
    document.addEventListener('DOMContentLoaded', function() {
        updateTotal();
    });
</script>
{% endblock %}
